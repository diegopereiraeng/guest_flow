# =============================================================================
# Harness IDP — Custom Scorecard Check
# Check: OpenAPI Spec Auto-Generated and Published
#
# How it works:
#   The CI pipeline runs `npm run generate:spec` (swagger-jsdoc) which reads
#   @openapi JSDoc annotations from Express route files and writes docs/openapi.yaml.
#   The spec is then uploaded to S3. The pipeline posts PASS to this check
#   after a successful upload.
#
# Ref: https://developer.harness.io/docs/internal-developer-portal/scorecards/custom-checks
# =============================================================================

apiVersion: harness.io/v1
kind: Check
identifier: openapi_spec_published
name: "OpenAPI Spec Auto-Generated and Published"
description: >
  Validates that the OpenAPI 3.0 specification for guestflow-api is
  auto-generated from JSDoc source annotations on every CI run and
  successfully published to the artifact store. Ensures the published
  spec always reflects the actual implementation.

owner: group:account/digital-experience-team
projectIdentifier: guestflow
orgIdentifier: default

metadata:
  tags:
    - api-contract
    - openapi
    - service-readiness
    - ci
  links:
    - title: Latest OpenAPI spec (S3)
      url: https://guestflow-artifacts.s3.us-east-1.amazonaws.com/openapi/latest/openapi.yaml
      type: specification
    - title: swagger-jsdoc
      url: https://github.com/Surnet/swagger-jsdoc
      type: documentation

spec:
  dataSource: ci_pipeline
  pipelineIdentifier: guestflow_ci

  rule:
    type: string
    operator: equals
    value: "PASS"
    field: status

  scorecard:
    category: ServiceReadiness
    weight: 20

  thresholds:
    pass:
      operator: equals
      value: "PASS"
    fail:
      operator: not_equals
      value: "PASS"
