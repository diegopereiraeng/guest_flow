# =============================================================================
# Harness IDP — Custom Scorecard Check
# Check: Backend Test Coverage >= 80%
#
# How it works:
#   The CI pipeline runs vitest --coverage, extracts the line coverage %,
#   and POSTs the result to the Harness IDP Check API (stage: idp_scorecard_checks).
#   This YAML is the check definition — import it via Harness IDP UI or API.
#
# Ref: https://developer.harness.io/docs/internal-developer-portal/scorecards/custom-checks
# =============================================================================

apiVersion: harness.io/v1
kind: Check
identifier: backend_test_coverage
name: "Backend Test Coverage ≥ 80%"
description: >
  Validates that the backend (Node.js/Vitest) line coverage percentage
  meets or exceeds the 80% threshold enforced in CI. Coverage data is
  extracted from the vitest --coverage lcov report on every pipeline run.

owner: group:account/digital-experience-team
projectIdentifier: guestflow
orgIdentifier: default

metadata:
  tags:
    - testing
    - quality
    - ci
  links:
    - title: Vitest Coverage Report
      url: https://app.harness.io/ng/account/YOUR_ACCOUNT/ci/orgs/default/projects/guestflow/pipelines/guestflow_ci/executions/latest/coverage
      type: report

spec:
  # Data source: results are pushed by the CI pipeline via Harness IDP API
  dataSource: ci_pipeline
  pipelineIdentifier: guestflow_ci

  # Evaluation rule
  rule:
    type: number
    operator: gte
    value: 80
    field: value          # the numeric coverage % sent by the pipeline step

  # How this check maps to a scorecard category
  scorecard:
    category: Testing
    weight: 25            # out of 100 for the Testing scorecard

  # Pass/fail thresholds for display
  thresholds:
    pass:
      operator: gte
      value: 80
    warn:
      operator: gte
      value: 70
    fail:
      operator: lt
      value: 70
