# =============================================================================
# Harness IDP — Custom Scorecard Check
# Check: SAST — No Critical Findings (Semgrep)
#
# How it works:
#   The CI pipeline runs Semgrep with rulesets: auto, owasp-top-ten, nodejs,
#   typescript. Results are parsed for ERROR-severity findings (mapped to
#   Critical). Zero critical findings = PASS.
#
# Scanner: Semgrep (open source)
# Ref: https://developer.harness.io/docs/internal-developer-portal/scorecards/custom-checks
# =============================================================================

apiVersion: harness.io/v1
kind: Check
identifier: sast_no_critical_findings
name: "SAST — No Critical Findings (Semgrep)"
description: >
  Validates that Semgrep SAST scan produces zero ERROR-severity (Critical)
  findings in the backend and frontend source code. Rulesets used:
  auto, p/owasp-top-ten, p/nodejs, p/typescript.

owner: group:account/digital-experience-team
projectIdentifier: guestflow
orgIdentifier: default

metadata:
  tags:
    - security
    - sast
    - semgrep
    - ci
  links:
    - title: Semgrep documentation
      url: https://semgrep.dev/docs/
      type: documentation
    - title: OWASP Top 10 rules
      url: https://semgrep.dev/p/owasp-top-ten
      type: documentation

spec:
  dataSource: ci_pipeline
  pipelineIdentifier: guestflow_ci

  rule:
    type: number
    operator: equals
    value: 0
    field: value          # CRITICAL finding count from Semgrep

  scorecard:
    category: Security
    weight: 30

  thresholds:
    pass:
      operator: equals
      value: 0
    fail:
      operator: gt
      value: 0
