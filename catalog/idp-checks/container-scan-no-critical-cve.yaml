# =============================================================================
# Harness IDP — Custom Scorecard Check
# Check: Container Scan — Zero Critical CVEs (Trivy)
#
# How it works:
#   The CI pipeline runs Trivy against both built Docker images (guestflow-api
#   and guestflow-web), counts CRITICAL severity CVEs, and POSTs the total
#   count. A value of 0 = PASS; anything > 0 = FAIL.
#
# Scanner: Trivy by Aqua Security (open source)
# Ref: https://developer.harness.io/docs/internal-developer-portal/scorecards/custom-checks
# =============================================================================

apiVersion: harness.io/v1
kind: Check
identifier: container_scan_no_critical_cve
name: "Container Scan — No Critical CVEs (Trivy)"
description: >
  Validates that the Docker images built for guestflow-api and guestflow-web
  contain zero CRITICAL severity CVEs as detected by Trivy. The scan runs
  against the exact image tags built in the same pipeline execution.

owner: group:account/digital-experience-team
projectIdentifier: Diego
orgIdentifier: TPM

metadata:
  tags:
    - security
    - container
    - trivy
    - ci
  links:
    - title: Trivy documentation
      url: https://aquasecurity.github.io/trivy/
      type: documentation

spec:
  dataSource: ci_pipeline
  pipelineIdentifier: guestflow_ci

  rule:
    type: number
    operator: equals
    value: 0
    field: value          # total CRITICAL CVE count across both images

  scorecard:
    category: Security
    weight: 35

  thresholds:
    pass:
      operator: equals
      value: 0
    warn:
      operator: lte
      value: 2
    fail:
      operator: gt
      value: 2
