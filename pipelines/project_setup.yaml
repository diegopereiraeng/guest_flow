pipeline:
  name: project-setup
  identifier: project_setup
  projectIdentifier: Diego
  orgIdentifier: TPM
  description: "Full self-service: create project → add admin → empty Harness Code repo → cookiecutter scaffold + push → service + CI pipeline → trigger CI → IDP catalog"
  tags:
    idp: ""
    self-service: ""
  variables:
    - name: app_name
      type: String
      description: "Display name (e.g. 'PetCare API') — used for service, pipeline names"
      value: <+input>
    - name: project_name
      type: String
      description: "Human-readable Harness project name"
      value: <+input>
    - name: project_identifier
      type: String
      description: "Harness project identifier (lowercase, underscores)"
      value: <+input>
    - name: project_description
      type: String
      description: "Short project description"
      value: <+input>
    - name: admin_email
      type: String
      description: "Email of user to add as project admin"
      value: <+input>
    - name: service_name
      type: String
      description: "Service/repo name (lowercase, hyphens)"
      value: <+input>
    - name: service_description
      type: String
      description: "Service description"
      value: <+input>
    - name: service_type
      type: String
      description: "fullstack | backend | frontend"
      value: <+input>
    - name: harness_org
      type: String
      description: "Harness org identifier"
      value: TPM
    - name: coverage_threshold
      type: String
      description: "Min coverage % (default 80)"
      value: "80"

  stages:
    # ─────────────────────────────────────────────────────────────
    # Stage 1 — Create Harness Project + Add Admin
    # ─────────────────────────────────────────────────────────────
    - stage:
        name: Create Project
        identifier: create_project_stage
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  name: Create Harness Project
                  identifier: create_harness_project
                  type: Run
                  timeout: 5m
                  spec:
                    shell: Sh
                    command: |
                      set -e
                      KEY=<+secrets.getValue("harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      PROJ_NAME="<+pipeline.variables.project_name>"
                      PROJ_DESC="<+pipeline.variables.project_description>"

                      echo "==> Creating project: $PROJ_NAME ($PROJ_ID)"

                      RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
                        "https://app.harness.io/ng/api/projects?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG" \
                        -H "x-api-key: $KEY" \
                        -H "Content-Type: application/json" \
                        -d "{
                          \"project\": {
                            \"orgIdentifier\": \"$ORG\",
                            \"identifier\": \"$PROJ_ID\",
                            \"name\": \"$PROJ_NAME\",
                            \"description\": \"$PROJ_DESC\",
                            \"color\": \"#0063F7\",
                            \"modules\": [\"CI\", \"CD\"]
                          }
                        }")

                      HTTP_CODE=$(echo "$RESP" | grep "HTTP:" | cut -d: -f2)
                      BODY=$(echo "$RESP" | grep -v "^HTTP:")

                      if echo "$BODY" | grep -q "already exists\|DUPLICATE\|already_exists"; then
                        echo "✅ Project $PROJ_ID already exists — continuing"
                      elif [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
                        echo "✅ Project created: $PROJ_NAME"
                        echo "   https://app.harness.io/ng/account/$ACCOUNT/all/orgs/$ORG/projects/$PROJ_ID"
                      else
                        echo "❌ Failed to create project (HTTP $HTTP_CODE)"
                        echo "$BODY"; exit 1
                      fi

              - step:
                  name: Add Running User as Project Admin
                  identifier: add_project_admin
                  type: Run
                  timeout: 5m
                  spec:
                    shell: Sh
                    command: |
                      set -e
                      KEY=<+secrets.getValue("harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      ADMIN_EMAIL="<+pipeline.variables.admin_email>"

                      echo "==> Looking up user: $ADMIN_EMAIL"

                      USER_RESP=$(curl -s \
                        "https://app.harness.io/ng/api/user/aggregate?accountIdentifier=$ACCOUNT&searchTerm=$ADMIN_EMAIL&pageSize=10" \
                        -H "x-api-key: $KEY")

                      USER_ID=$(echo "$USER_RESP" | grep -o '"uuid":"[^"]*"' | head -1 | cut -d'"' -f4)

                      if [ -z "$USER_ID" ]; then
                        echo "⚠️  User not found — sending project invite with admin role"
                        INVITE_RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
                          "https://app.harness.io/ng/api/invites?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                          -H "x-api-key: $KEY" \
                          -H "Content-Type: application/json" \
                          -d "{
                            \"emails\": [\"$ADMIN_EMAIL\"],
                            \"roleBindings\": [{
                              \"roleIdentifier\": \"_project_admin\",
                              \"roleName\": \"Project Admin\",
                              \"resourceGroupIdentifier\": \"_all_project_level_resources\",
                              \"resourceGroupName\": \"All Project Level Resources\",
                              \"managed\": true
                            }],
                            \"inviteType\": \"USER_INITIATED_INVITE\"
                          }")
                        echo "✅ Invite sent to $ADMIN_EMAIL"
                      else
                        echo "==> Found user $USER_ID — assigning Project Admin role"
                        ROLE_RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
                          "https://app.harness.io/ng/api/roleassignments?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                          -H "x-api-key: $KEY" \
                          -H "Content-Type: application/json" \
                          -d "{
                            \"resourceGroupIdentifier\": \"_all_project_level_resources\",
                            \"roleIdentifier\": \"_project_admin\",
                            \"principal\": {\"identifier\": \"$USER_ID\", \"type\": \"USER\"},
                            \"disabled\": false,
                            \"managed\": false
                          }")
                        HTTP_CODE=$(echo "$ROLE_RESP" | grep "HTTP:" | cut -d: -f2)
                        if echo "$ROLE_RESP" | grep -q "already exists\|DUPLICATE"; then
                          echo "✅ User already has Project Admin"
                        elif [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
                          echo "✅ Assigned Project Admin to $ADMIN_EMAIL"
                        else
                          echo "⚠️  Role assignment HTTP $HTTP_CODE (non-blocking)"
                          echo "$ROLE_RESP" | grep -v "HTTP:" | head -3
                        fi
                      fi

    # ─────────────────────────────────────────────────────────────
    # Stage 2 — Create Empty Harness Code Repo
    # ─────────────────────────────────────────────────────────────
    - stage:
        name: Create Repo
        identifier: create_repo_stage
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  name: Create Empty Harness Code Repo
                  identifier: create_harness_repo
                  type: Run
                  timeout: 5m
                  spec:
                    shell: Sh
                    command: |
                      set -e
                      KEY=<+secrets.getValue("harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      SERVICE_NAME="<+pipeline.variables.service_name>"
                      SERVICE_DESC="<+pipeline.variables.service_description>"

                      echo "==> Creating Harness Code repo: $SERVICE_NAME in $PROJ_ID"

                      RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
                        "https://app.harness.io/code/api/v1/repos?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                        -H "x-api-key: $KEY" \
                        -H "Content-Type: application/json" \
                        -d "{
                          \"uid\": \"$SERVICE_NAME\",
                          \"description\": \"$SERVICE_DESC\",
                          \"default_branch\": \"main\",
                          \"is_public\": false
                        }")

                      HTTP_CODE=$(echo "$RESP" | grep "HTTP:" | cut -d: -f2)
                      BODY=$(echo "$RESP" | grep -v "^HTTP:")

                      if echo "$BODY" | grep -q "already exists\|409"; then
                        echo "✅ Repo already exists — continuing"
                      elif [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
                        echo "✅ Harness Code repo created: $SERVICE_NAME"
                        echo "   https://app.harness.io/ng/account/$ACCOUNT/module/code/orgs/$ORG/repos/$PROJ_ID/$SERVICE_NAME"
                      else
                        echo "❌ Failed to create repo (HTTP $HTTP_CODE)"
                        echo "$BODY"; exit 1
                      fi

    # ─────────────────────────────────────────────────────────────
    # Stage 3 — Scaffold from Cookiecutter + Push to Harness Code
    # ─────────────────────────────────────────────────────────────
    - stage:
        name: Scaffold and Push
        identifier: scaffold_push_stage
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  name: Generate from Cookiecutter
                  identifier: generate_cookiecutter
                  type: Run
                  timeout: 10m
                  spec:
                    shell: Sh
                    command: |
                      set -e
                      apk add --no-cache python3 py3-pip git curl jq

                      # Install cookiecutter
                      pip install --quiet cookiecutter

                      KEY=<+secrets.getValue("harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      SERVICE_NAME="<+pipeline.variables.service_name>"
                      SERVICE_DESC="<+pipeline.variables.service_description>"
                      SERVICE_TYPE="<+pipeline.variables.service_type>"
                      APP_NAME="<+pipeline.variables.app_name>"
                      COVERAGE="<+pipeline.variables.coverage_threshold>"
                      ADMIN_EMAIL="<+pipeline.variables.admin_email>"

                      echo "==> Scaffolding: $SERVICE_NAME ($SERVICE_TYPE)"

                      cookiecutter https://github.com/diegopereiraeng/cookiecutter-harness-service.git \
                        --no-input \
                        --output-dir /harness \
                        service_name="$SERVICE_NAME" \
                        service_description="$SERVICE_DESC" \
                        service_type="$SERVICE_TYPE" \
                        owner_email="$ADMIN_EMAIL" \
                        github_org="diegopereiraeng" \
                        harness_org="$ORG" \
                        harness_project="$PROJ_ID" \
                        coverage_threshold="$COVERAGE"

                      echo "==> Files generated:"
                      find /harness/$SERVICE_NAME -type f | grep -v node_modules | sort

                      echo "==> Pushing to Harness Code repo"
                      cd /harness/$SERVICE_NAME

                      git config --global user.email "ci-bot@harness.io"
                      git config --global user.name "Harness Scaffold"
                      git config --global --add safe.directory '*'

                      git init
                      git add -A
                      git commit -m "chore: initial scaffold from cookiecutter-harness-service [ci skip]

                      App: $APP_NAME
                      Type: $SERVICE_TYPE
                      Generated by project_setup pipeline"

                      git branch -M main

                      # Push to Harness Code using API key as token
                      HARNESS_REPO_URL="https://x-token-auth:${KEY}@app.harness.io/code/git/${ACCOUNT}/${ORG}/${PROJ_ID}/${SERVICE_NAME}.git"
                      git remote add origin "$HARNESS_REPO_URL"
                      git push -u origin main

                      echo "✅ Code pushed to Harness Code repo"
                      echo "   https://app.harness.io/ng/account/$ACCOUNT/module/code/orgs/$ORG/repos/$PROJ_ID/$SERVICE_NAME"

    # ─────────────────────────────────────────────────────────────
    # Stage 4 — Create Harness Service + CI Pipeline + Trigger it
    # ─────────────────────────────────────────────────────────────
    - stage:
        name: Harness Resources
        identifier: harness_resources_stage
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  name: Create Harness Service
                  identifier: create_harness_service
                  type: Run
                  timeout: 5m
                  spec:
                    shell: Sh
                    command: |
                      set -e
                      KEY=<+secrets.getValue("harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      APP_NAME="<+pipeline.variables.app_name>"
                      SERVICE_NAME="<+pipeline.variables.service_name>"
                      SERVICE_TYPE="<+pipeline.variables.service_type>"
                      SERVICE_ID=$(echo "$SERVICE_NAME" | tr '-' '_')

                      echo "==> Creating service: $APP_NAME ($SERVICE_ID)"

                      RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
                        "https://app.harness.io/ng/api/servicesV2?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                        -H "x-api-key: $KEY" \
                        -H "Content-Type: application/json" \
                        -d "{
                          \"name\": \"$APP_NAME\",
                          \"identifier\": \"$SERVICE_ID\",
                          \"orgIdentifier\": \"$ORG\",
                          \"projectIdentifier\": \"$PROJ_ID\",
                          \"description\": \"<+pipeline.variables.service_description>\",
                          \"tags\": {\"setup\": \"\", \"service_type\": \"$SERVICE_TYPE\"}
                        }")

                      HTTP_CODE=$(echo "$RESP" | grep "HTTP:" | cut -d: -f2)
                      if echo "$RESP" | grep -q "already exists\|DUPLICATE\|409"; then
                        echo "✅ Service already exists"
                      elif [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
                        echo "✅ Service created: $APP_NAME"
                      else
                        echo "⚠️  Service HTTP $HTTP_CODE (non-blocking)"
                        echo "$RESP" | grep -v "HTTP:" | head -3
                      fi

              - step:
                  name: Create CI Pipeline
                  identifier: create_ci_pipeline
                  type: Run
                  timeout: 10m
                  spec:
                    shell: Sh
                    command: |
                      set -e
                      KEY=<+secrets.getValue("harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      APP_NAME="<+pipeline.variables.app_name>"
                      SERVICE_NAME="<+pipeline.variables.service_name>"
                      SERVICE_TYPE="<+pipeline.variables.service_type>"
                      SERVICE_ID=$(echo "$SERVICE_NAME" | tr '-' '_')
                      COVERAGE="<+pipeline.variables.coverage_threshold>"

                      echo "==> Creating pipeline: $APP_NAME CI in $PROJ_ID"

                      # Build a connector ref pointing to the Harness Code repo in the new project
                      # Using inline connector approach with Harness Code
                      PIPE_YAML="pipeline:
                        name: $APP_NAME CI
                        identifier: ${SERVICE_ID}_ci
                        projectIdentifier: $PROJ_ID
                        orgIdentifier: $ORG
                        tags:
                          setup: \"\"
                        variables:
                          - name: app_name
                            type: String
                            value: $APP_NAME
                          - name: service_name
                            type: String
                            value: $SERVICE_NAME
                          - name: service_type
                            type: String
                            value: $SERVICE_TYPE
                          - name: coverage_threshold
                            type: String
                            value: \"$COVERAGE\"
                          - name: image_name_api
                            type: String
                            value: ${SERVICE_NAME}-api
                          - name: image_name_web
                            type: String
                            value: ${SERVICE_NAME}-web
                        properties:
                          ci:
                            codebase:
                              repoName: $SERVICE_NAME
                              connectorRef: account.HarnessCode
                              build: <+input>
                        stages:
                          - stage:
                              name: Backend CI
                              identifier: backend_ci
                              type: CI
                              when:
                                pipelineStatus: Success
                                condition: <+pipeline.variables.service_type> == \"fullstack\" || <+pipeline.variables.service_type> == \"backend\"
                              spec:
                                cloneCodebase: true
                                platform:
                                  os: Linux
                                  arch: Amd64
                                runtime:
                                  type: Cloud
                                  spec: {}
                                execution:
                                  steps:
                                    - step:
                                        name: Install Dependencies
                                        identifier: install_deps
                                        type: Run
                                        spec:
                                          shell: Sh
                                          command: |
                                            cd backend && npm ci
                                    - step:
                                        name: TypeCheck
                                        identifier: typecheck
                                        type: Run
                                        spec:
                                          shell: Sh
                                          command: |
                                            cd backend && npx tsc --noEmit
                                    - step:
                                        name: Tests and Coverage
                                        identifier: tests_coverage
                                        type: Run
                                        spec:
                                          shell: Sh
                                          command: |
                                            cd backend
                                            npm test -- --coverage --coverageReporters=json-summary
                                            COV=\$(node -e \"const s=require('./coverage/coverage-summary.json');console.log(s.total.lines.pct)\")
                                            echo \"Coverage: \$COV%\"
                                            awk \"BEGIN{exit (\$COV < $COVERAGE)}\" || (echo '❌ Coverage too low'; exit 1)
                          - stage:
                              name: Frontend CI
                              identifier: frontend_ci
                              type: CI
                              when:
                                pipelineStatus: Success
                                condition: <+pipeline.variables.service_type> == \"fullstack\" || <+pipeline.variables.service_type> == \"frontend\"
                              spec:
                                cloneCodebase: true
                                platform:
                                  os: Linux
                                  arch: Amd64
                                runtime:
                                  type: Cloud
                                  spec: {}
                                execution:
                                  steps:
                                    - step:
                                        name: Install Dependencies
                                        identifier: install_deps_fe
                                        type: Run
                                        spec:
                                          shell: Sh
                                          command: |
                                            cd frontend && npm ci
                                    - step:
                                        name: Build
                                        identifier: build_fe
                                        type: Run
                                        spec:
                                          shell: Sh
                                          command: |
                                            cd frontend && npm run build"

                      RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
                        "https://app.harness.io/pipeline/api/pipelines?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                        -H "x-api-key: $KEY" \
                        -H "Content-Type: application/yaml" \
                        --data-binary "$PIPE_YAML")

                      HTTP_CODE=$(echo "$RESP" | grep "HTTP:" | cut -d: -f2)
                      if echo "$RESP" | grep -q "already exists\|DUPLICATE\|409"; then
                        echo "✅ Pipeline ${SERVICE_ID}_ci already exists"
                      elif [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
                        echo "✅ Pipeline '$APP_NAME CI' created"
                        echo "   https://app.harness.io/ng/account/$ACCOUNT/all/orgs/$ORG/projects/$PROJ_ID/pipelines/${SERVICE_ID}_ci"
                      else
                        echo "⚠️  Pipeline HTTP $HTTP_CODE (non-blocking)"
                        echo "$RESP" | grep -v "HTTP:" | head -5
                      fi

              - step:
                  name: Trigger First CI Run
                  identifier: trigger_ci_pipeline
                  type: Run
                  timeout: 5m
                  spec:
                    shell: Sh
                    command: |
                      set -e
                      KEY=<+secrets.getValue("harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      SERVICE_NAME="<+pipeline.variables.service_name>"
                      SERVICE_ID=$(echo "$SERVICE_NAME" | tr '-' '_')
                      APP_NAME="<+pipeline.variables.app_name>"

                      echo "==> Triggering first run of $APP_NAME CI"

                      # Wait 3s for pipeline to be fully indexed
                      sleep 3

                      RUN_RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
                        "https://app.harness.io/pipeline/api/pipeline/execute/${SERVICE_ID}_ci?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                        -H "x-api-key: $KEY" \
                        -H "Content-Type: application/yaml" \
                        --data-binary "pipeline:
                          identifier: ${SERVICE_ID}_ci
                          properties:
                            ci:
                              codebase:
                                build:
                                  type: branch
                                  spec:
                                    branch: main")

                      HTTP_CODE=$(echo "$RUN_RESP" | grep "HTTP:" | cut -d: -f2)
                      BODY=$(echo "$RUN_RESP" | grep -v "^HTTP:")

                      if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
                        EXEC_ID=$(echo "$BODY" | grep -o '"planExecutionId":"[^"]*"' | head -1 | cut -d'"' -f4)
                        echo "✅ CI triggered! Execution: $EXEC_ID"
                        echo "   https://app.harness.io/ng/account/$ACCOUNT/all/orgs/$ORG/projects/$PROJ_ID/pipelines/${SERVICE_ID}_ci/deployments/$EXEC_ID/pipeline"
                      else
                        echo "⚠️  Trigger HTTP $HTTP_CODE (non-blocking — run manually from the UI)"
                        echo "$BODY" | head -5
                      fi

    # ─────────────────────────────────────────────────────────────
    # Stage 5 — Register IDP Catalog Entities
    # ─────────────────────────────────────────────────────────────
    - stage:
        name: Register Catalog
        identifier: register_catalog_stage
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  name: Import Catalog Entities
                  identifier: import_catalog
                  type: Run
                  timeout: 5m
                  spec:
                    shell: Sh
                    command: |
                      set -e
                      KEY=<+secrets.getValue("harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      SERVICE_NAME="<+pipeline.variables.service_name>"
                      SERVICE_TYPE="<+pipeline.variables.service_type>"

                      import_entity() {
                        local FILE_PATH="$1"
                        local LABEL="$2"
                        echo "==> Importing $LABEL ($FILE_PATH)"

                        RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
                          "https://app.harness.io/v1/entities/import?orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                          -H "Content-Type: application/json" \
                          -H "Harness-Account: $ACCOUNT" \
                          -H "x-api-key: $KEY" \
                          -d "{
                            \"connector_ref\": \"account.HarnessCode\",
                            \"repo_name\": \"$SERVICE_NAME\",
                            \"branch_name\": \"main\",
                            \"file_path\": \"$FILE_PATH\",
                            \"is_harness_code_repo\": true
                          }")

                        HTTP_CODE=$(echo "$RESP" | grep "HTTP:" | cut -d: -f2)
                        BODY=$(echo "$RESP" | grep -v "^HTTP:")

                        if [ "$HTTP_CODE" = "201" ]; then
                          echo "✅ $LABEL registered"
                        elif echo "$BODY" | grep -q "DUPLICATE_FILE_IMPORT"; then
                          echo "✅ $LABEL already registered — IDP will sync"
                        else
                          echo "⚠️  $LABEL → HTTP $HTTP_CODE (non-blocking)"
                          echo "$BODY" | head -3
                        fi
                      }

                      case "$SERVICE_TYPE" in
                        fullstack)
                          import_entity "catalog/$SERVICE_NAME-api.yaml"     "API component"
                          import_entity "catalog/$SERVICE_NAME-web.yaml"     "Web component"
                          import_entity "catalog/$SERVICE_NAME-openapi.yaml" "OpenAPI spec"
                          ;;
                        backend)
                          import_entity "catalog/$SERVICE_NAME-api.yaml"     "API component"
                          import_entity "catalog/$SERVICE_NAME-openapi.yaml" "OpenAPI spec"
                          ;;
                        frontend)
                          import_entity "catalog/$SERVICE_NAME-web.yaml"     "Web component"
                          ;;
                      esac

                      echo ""
                      echo "🎉 Project ready!"
                      echo "   Project:  https://app.harness.io/ng/account/$ACCOUNT/all/orgs/$ORG/projects/$PROJ_ID"
                      echo "   Code:     https://app.harness.io/ng/account/$ACCOUNT/module/code/orgs/$ORG/repos/$PROJ_ID/$SERVICE_NAME"
                      echo "   Pipeline: https://app.harness.io/ng/account/$ACCOUNT/all/orgs/$ORG/projects/$PROJ_ID/pipelines"
                      echo "   Catalog:  https://app.harness.io/ng/account/$ACCOUNT/module/idp/catalog"
