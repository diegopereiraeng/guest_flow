pipeline:
  identifier: project_setup_v2
  name: project-setup-v2
  orgIdentifier: Admin
  projectIdentifier: IDP_Workflows
  description: "Full self-service: create project + admin, Harness Code repo, cookiecutter scaffold, CI pipeline, IDP catalog"
  tags:
    idp: ""
    self-service: ""
  variables:
    - name: app_name
      type: String
      value: <+input>
    - name: project_name
      type: String
      value: <+input>
    - name: project_identifier
      type: String
      value: <+input>
    - name: project_description
      type: String
      value: <+input>
    - name: admin_email
      type: String
      value: <+input>
    - name: service_name
      type: String
      value: <+input>
    - name: service_description
      type: String
      value: <+input>
    - name: service_type
      type: String
      value: <+input>
    - name: harness_org
      type: String
      value: LAB
    - name: coverage_threshold
      type: String
      value: "80"
  stages:
    - stage:
        name: Create Project
        identifier: create_project_stage
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  name: Create Harness Project
                  identifier: create_harness_project
                  type: Run
                  timeout: 5m
                  spec:
                    shell: Sh
                    command: |-
                      set -e
                      KEY=<+secrets.getValue("account.harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      PROJ_NAME="<+pipeline.variables.project_name>"
                      PROJ_DESC="<+pipeline.variables.project_description>"
                      echo "==> Creating project: $PROJ_NAME"
                      RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
                        "https://app.harness.io/ng/api/projects?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG" \
                        -H "x-api-key: $KEY" -H "Content-Type: application/json" \
                        -d "{\"project\": {\"orgIdentifier\": \"$ORG\", \"identifier\": \"$PROJ_ID\", \"name\": \"$PROJ_NAME\", \"description\": \"$PROJ_DESC\", \"color\": \"#0063F7\", \"modules\": [\"CI\", \"CD\"]}}")
                      HTTP_CODE=$(echo "$RESP" | grep "HTTP:" | cut -d: -f2)
                      BODY=$(echo "$RESP" | grep -v "^HTTP:")
                      if echo "$BODY" | grep -q "already exists\|DUPLICATE"; then
                        echo "Project already exists"
                      elif [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
                        echo "Project created: $PROJ_NAME"
                      else
                        echo "Failed HTTP $HTTP_CODE"; echo "$BODY"; exit 1
                      fi
              - step:
                  name: Add Project Admin
                  identifier: add_project_admin
                  type: Run
                  timeout: 5m
                  spec:
                    shell: Sh
                    command: |-
                      set -e
                      KEY=<+secrets.getValue("account.harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      ADMIN_EMAIL="<+pipeline.variables.admin_email>"
                      USER_RESP=$(curl -s "https://app.harness.io/ng/api/user/aggregate?accountIdentifier=$ACCOUNT&searchTerm=$ADMIN_EMAIL&pageSize=10" -H "x-api-key: $KEY")
                      USER_ID=$(echo "$USER_RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); users=d.get('data',{}).get('content',[]); print(users[0]['user']['uuid'] if users else '')" 2>/dev/null || echo "")
                      if [ -z "$USER_ID" ]; then
                        curl -s -X POST "https://app.harness.io/ng/api/invites?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                          -H "x-api-key: $KEY" -H "Content-Type: application/json" \
                          -d "{\"emails\": [\"$ADMIN_EMAIL\"], \"roleBindings\": [{\"roleIdentifier\": \"_project_admin\", \"roleName\": \"Project Admin\", \"resourceGroupIdentifier\": \"_all_project_level_resources\", \"resourceGroupName\": \"All Project Level Resources\", \"managed\": true}], \"inviteType\": \"USER_INITIATED_INVITE\"}"
                        echo "Invite sent to $ADMIN_EMAIL"
                      else
                        ROLE_RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
                          "https://app.harness.io/ng/api/roleassignments?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                          -H "x-api-key: $KEY" -H "Content-Type: application/json" \
                          -d "{\"resourceGroupIdentifier\": \"_all_project_level_resources\", \"roleIdentifier\": \"_project_admin\", \"principal\": {\"identifier\": \"$USER_ID\", \"type\": \"USER\"}, \"disabled\": false, \"managed\": false}")
                        HTTP_CODE=$(echo "$ROLE_RESP" | grep "HTTP:" | cut -d: -f2)
                        if echo "$ROLE_RESP" | grep -q "already exists\|DUPLICATE"; then echo "Admin already assigned"
                        elif [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then echo "Admin assigned: $ADMIN_EMAIL"
                        else echo "Role assign HTTP $HTTP_CODE (non-blocking)"
                        fi
                      fi
    - stage:
        name: Create Repo
        identifier: create_repo_stage
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  name: Create Empty Harness Code Repo
                  identifier: create_harness_repo
                  type: Run
                  timeout: 5m
                  spec:
                    shell: Sh
                    command: |-
                      set -e
                      KEY=<+secrets.getValue("account.harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      SERVICE_NAME="<+pipeline.variables.service_name>"
                      SERVICE_DESC="<+pipeline.variables.service_description>"
                      echo "==> Creating Harness Code repo: $SERVICE_NAME in $PROJ_ID"
                      RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
                        "https://app.harness.io/code/api/v1/repos?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                        -H "x-api-key: $KEY" -H "Content-Type: application/json" \
                        -d "{\"uid\": \"$SERVICE_NAME\", \"description\": \"$SERVICE_DESC\", \"default_branch\": \"main\", \"is_public\": false}")
                      HTTP_CODE=$(echo "$RESP" | grep "HTTP:" | cut -d: -f2)
                      BODY=$(echo "$RESP" | grep -v "^HTTP:")
                      if echo "$BODY" | grep -q "already exists\|409"; then echo "Repo already exists"
                      elif [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then echo "Harness Code repo created: $SERVICE_NAME"
                      else echo "Failed HTTP $HTTP_CODE"; echo "$BODY"; exit 1
                      fi
    - stage:
        name: Scaffold and Push
        identifier: scaffold_push_stage
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  name: Generate from Cookiecutter
                  identifier: generate_cookiecutter
                  type: Run
                  timeout: 20m
                  spec:
                    shell: Bash
                    command: |-
                      set -euo pipefail
                      apt-get update -qq && apt-get install -y -qq python3 python3-pip git curl jq 2>/dev/null
                      pip3 install --quiet --no-cache-dir cookiecutter

                      SERVICE_NAME="<+pipeline.variables.service_name>"
                      SERVICE_TYPE="<+pipeline.variables.service_type>"
                      SERVICE_DESC="<+pipeline.variables.service_description>"
                      HARNESS_ORG="<+pipeline.variables.harness_org>"
                      HARNESS_PROJECT="<+pipeline.variables.project_identifier>"
                      COVERAGE_THRESHOLD="<+pipeline.variables.coverage_threshold>"
                      ADMIN_EMAIL="<+pipeline.variables.admin_email>"

                      TEMPLATE_URL="https://github.com/diegopereiraeng/cookiecutter-harness-service.git"
                      TEMPLATE_DIR="/tmp/cookiecutter-harness-service"

                      echo "==> Cloning cookiecutter template..."
                      rm -rf "$TEMPLATE_DIR"
                      timeout 90 git clone --depth 1 "$TEMPLATE_URL" "$TEMPLATE_DIR" \
                        || { echo "ERROR: failed to clone template from GitHub (timeout or network error)"; exit 1; }
                      echo "==> Template cloned successfully"

                      echo "==> Generating: $SERVICE_NAME ($SERVICE_TYPE)"
                      cookiecutter "$TEMPLATE_DIR" \
                        --no-input \
                        --output-dir /harness \
                        service_name="$SERVICE_NAME" \
                        service_description="$SERVICE_DESC" \
                        service_type="$SERVICE_TYPE" \
                        owner_email="$ADMIN_EMAIL" \
                        github_org="diegopereiraeng" \
                        harness_org="$HARNESS_ORG" \
                        harness_project="$HARNESS_PROJECT" \
                        coverage_threshold="$COVERAGE_THRESHOLD"

                      echo "==> Generated $(find /harness/$SERVICE_NAME -type f | grep -v node_modules | wc -l) files"

                      for PKG_FILE in \
                        "/harness/$SERVICE_NAME/frontend/package.json" \
                        "/harness/$SERVICE_NAME/backend/package.json" \
                        "/harness/$SERVICE_NAME/package.json"; do
                        [ -f "$PKG_FILE" ] || continue
                        echo "==> Checking $PKG_FILE"
                        IS_VITE=$(jq -r 'if ((.devDependencies["vite"] // .devDependencies["@vitejs/plugin-react"]) != null) then "true" else "false" end' "$PKG_FILE")
                        if [ "$IS_VITE" = "true" ]; then
                          jq '.scripts["test:ci"] = "npx vitest run --coverage --coverage.reporter=json-summary --coverage.reporter=lcov --reporter=junit --outputFile=test-results/junit.xml" | .devDependencies["jsdom"] = "^20.0.0" | .devDependencies["@vitest/coverage-v8"] = "^1.0.0"' \
                            "$PKG_FILE" > /tmp/pkg_patched.json && mv /tmp/pkg_patched.json "$PKG_FILE"
                          echo "  Patched test:ci => vitest + coverage + jsdom (vite project): $PKG_FILE"
                          continue
                        fi
                        HAS_TEST_CI=$(jq -e '.scripts["test:ci"]' "$PKG_FILE" > /dev/null 2>&1 && echo true || echo false)
                        HAS_JEST=$(jq -e '.devDependencies["jest"]' "$PKG_FILE" > /dev/null 2>&1 && echo true || echo false)
                        [ "$HAS_TEST_CI" = "true" ] && [ "$HAS_JEST" = "true" ] && { echo "  test:ci + jest already in $PKG_FILE (skipping)"; continue; }
                        IS_REACT=$(jq -r 'if ((.dependencies["react-scripts"] // .devDependencies["react-scripts"]) != null) then "true" else "false" end' "$PKG_FILE")
                        if [ "$IS_REACT" = "true" ]; then
                          TEST_CMD="react-scripts test --watchAll=false --ci --reporters=default --reporters=jest-junit"
                          jq --arg cmd "$TEST_CMD" \
                            '.scripts["test:ci"] = $cmd | .devDependencies["jest-junit"] = "^16.0.0" | .["jest-junit"] = {"outputDirectory": "test-results", "outputName": "junit.xml"}' \
                            "$PKG_FILE" > /tmp/pkg_patched.json && mv /tmp/pkg_patched.json "$PKG_FILE"
                        else
                          TEST_CMD="jest --ci --coverage --coverageReporters=json-summary --coverageReporters=lcov --reporters=default --reporters=jest-junit --passWithNoTests"
                          jq --arg cmd "$TEST_CMD" \
                            '.scripts["test:ci"] = $cmd |
                             .devDependencies["jest"] = "^29.7.0" |
                             .devDependencies["ts-jest"] = "^29.1.0" |
                             .devDependencies["@types/jest"] = "^29.5.0" |
                             .devDependencies["jest-environment-jsdom"] = "^29.7.0" |
                             .devDependencies["jest-junit"] = "^16.0.0" |
                             .["jest-junit"] = {"outputDirectory": "test-results", "outputName": "junit.xml"} |
                             .["jest"] = {"preset": "ts-jest/legacy", "testEnvironment": "node", "testMatch": ["**/?(*.)+(spec|test).[jt]s?(x)"], "passWithNoTests": true, "coverageDirectory": "coverage", "coverageReporters": ["json-summary", "lcov", "text"]}' \
                            "$PKG_FILE" > /tmp/pkg_patched.json && mv /tmp/pkg_patched.json "$PKG_FILE"
                        fi
                        PKG_DIR=$(dirname "$PKG_FILE")
                        if [ -f "$PKG_DIR/jest.config.ts" ] || [ -f "$PKG_DIR/jest.config.js" ] || [ -f "$PKG_DIR/jest.config.cjs" ] || [ -f "$PKG_DIR/jest.config.mjs" ]; then
                          jq 'del(.jest)' "$PKG_FILE" > /tmp/pkg_patched.json && mv /tmp/pkg_patched.json "$PKG_FILE"
                          echo "  Removed inline jest config from $PKG_FILE (jest.config.* exists)"
                        fi
                        if jq -e '.dependencies["swagger-jsdoc"] // .devDependencies["swagger-jsdoc"]' "$PKG_FILE" > /dev/null 2>&1; then
                          jq '.devDependencies["@types/swagger-jsdoc"] = "^6.0.4"' "$PKG_FILE" > /tmp/pkg_patched.json && mv /tmp/pkg_patched.json "$PKG_FILE"
                          echo "  Added @types/swagger-jsdoc to $PKG_FILE"
                        fi
                        echo "  Patched: $PKG_FILE | vite=$IS_VITE react=$IS_REACT"
                      done
                      echo "==> package.json patch complete"

                      for TSC_FILE in \
                        "/harness/$SERVICE_NAME/frontend/tsconfig.json" \
                        "/harness/$SERVICE_NAME/frontend/tsconfig.app.json" \
                        "/harness/$SERVICE_NAME/tsconfig.json"; do
                        [ -f "$TSC_FILE" ] || continue
                        sed -i 's/"noUnusedLocals": true/"noUnusedLocals": false/g' "$TSC_FILE"
                        sed -i 's/"noUnusedParameters": true/"noUnusedParameters": false/g' "$TSC_FILE"
                        sed -i 's/"jsx": "react"/"jsx": "react-jsx"/g' "$TSC_FILE"
                        echo "  Patched noUnusedLocals/Params + jsx:react-jsx in $TSC_FILE"
                      done
                      VITE_CFG="/harness/$SERVICE_NAME/frontend/vite.config.ts"
                      if [ -f "$VITE_CFG" ] && grep -q "environment:" "$VITE_CFG"; then
                        sed -i "s/environment: 'jsdom',/environment: 'jsdom',\n      passWithNoTests: true,/" "$VITE_CFG"
                        echo "  Added passWithNoTests to vite.config.ts"
                      fi
                      MAIN_TSX="/harness/$SERVICE_NAME/frontend/src/main.tsx"
                      if [ -f "$MAIN_TSX" ] && grep -q "React\.StrictMode" "$MAIN_TSX"; then
                        sed -i 's/<React\.StrictMode>/<StrictMode>/g; s/<\/React\.StrictMode>/<\/StrictMode>/g' "$MAIN_TSX"
                        if ! grep -qE "import.*StrictMode.*from .react." "$MAIN_TSX"; then
                          sed -i "1s/^/import { StrictMode } from 'react'\n/" "$MAIN_TSX"
                        fi
                        echo "  Fixed main.tsx: React.StrictMode -> StrictMode (named import)"
                      fi
                      find "/harness/$SERVICE_NAME/frontend/src" -name "*.tsx" -o -name "*.jsx" 2>/dev/null | while read F; do
                        if grep -q "^import React from ['\"]react['\"]" "$F"; then
                          sed -i "/^import React from ['\"]react['\"];*$/d" "$F"
                          echo "  Removed legacy React import from $F"
                        fi
                      done
                      echo "==> TypeScript patch complete"

                      echo "==> Generating package-lock.json files..."
                      for PKG_DIR in \
                        "/harness/$SERVICE_NAME/frontend" \
                        "/harness/$SERVICE_NAME/backend" \
                        "/harness/$SERVICE_NAME"; do
                        [ -f "$PKG_DIR/package.json" ] || continue
                        if [ -f "$PKG_DIR/package-lock.json" ]; then
                          echo "  exists: $PKG_DIR/package-lock.json (skip)"
                          continue
                        fi
                        echo "  npm install: $PKG_DIR"
                        cd "$PKG_DIR"
                        npm install --ignore-scripts --legacy-peer-deps 2>&1 | tail -5
                        [ -f "package-lock.json" ] && echo "  generated: $PKG_DIR/package-lock.json" || echo "  WARN: package-lock.json not generated in $PKG_DIR"
                        cd /harness/$SERVICE_NAME
                      done
                      echo "==> package-lock.json generation complete"
                      echo "==> Creating test files..."
                      mkdir -p "/harness/$SERVICE_NAME/frontend/src/__tests__"
                      { echo "import { describe, it, expect } from 'vitest'"; echo "import App from '../App'"; echo ""; echo "describe('App', () => {"; echo "  it('is a function component', () => {"; echo "    expect(typeof App).toBe('function')"; echo "  })"; echo "  it('has the correct display name', () => {"; echo "    expect(App.name).toBe('App')"; echo "  })"; echo "})"; } > "/harness/$SERVICE_NAME/frontend/src/__tests__/App.test.tsx"
                      mkdir -p "/harness/$SERVICE_NAME/backend/src/__tests__"
                      { echo "import { router } from '../routes'"; echo ""; echo "describe('API Routes', () => {"; echo "  it('router is defined', () => {"; echo "    expect(router).toBeDefined()"; echo "  })"; echo "  it('router registers /hello route', () => {"; echo "    const paths = (router as any).stack"; echo "      .filter((layer: any) => layer.route)"; echo "      .map((layer: any) => layer.route.path as string)"; echo "    expect(paths).toContain('/hello')"; echo "  })"; echo "})"; } > "/harness/$SERVICE_NAME/backend/src/__tests__/routes.test.ts"
                      echo "==> Test files created"
              - step:
                  name: Upload to Harness Code via REST API
                  identifier: push_to_harness_code
                  type: Run
                  timeout: 10m
                  spec:
                    shell: Bash
                    command: |-
                      set -euo pipefail
                      KEY=<+secrets.getValue("account.harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      SERVICE_NAME="<+pipeline.variables.service_name>"

                      GIT_URL="https://app.harness.io/code/git/${ACCOUNT}/${ORG}/${PROJ_ID}/${SERVICE_NAME}.git"
                      GIT_AUTH="-c http.extraHeader=x-api-key:${KEY}"

                      cd /harness/$SERVICE_NAME

                      echo "==> Checking if repo already has content..."
                      EXISTING=$(git ${GIT_AUTH} ls-remote "$GIT_URL" HEAD 2>/dev/null || echo "")
                      if [ -n "$EXISTING" ]; then
                        echo "==> Repo already has commits (idempotent), skipping scaffold push"
                        exit 0
                      fi

                      echo "==> Pushing scaffold via git..."
                      git init
                      git config user.email "harness-pipeline@harness.io"
                      git config user.name "Harness Pipeline"
                      git checkout -b main
                      git add .
                      git commit -m "chore: initial scaffold from cookiecutter-harness-service"
                      git remote add origin "$GIT_URL"
                      git ${GIT_AUTH} push origin main

                      echo "==> Scaffold pushed to Harness Code: $SERVICE_NAME"
    - stage:
        name: Harness Resources
        identifier: harness_resources_stage
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  name: Verify Account Templates
                  identifier: verify_account_templates
                  type: Run
                  timeout: 5m
                  spec:
                    shell: Sh
                    command: |-
                      set -e
                      KEY=<+secrets.getValue("account.harness_api_key")>
                      ACCOUNT="<+account.identifier>"

                      chk() {
                        HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
                          "https://app.harness.io/template/api/templates/$1?accountIdentifier=$ACCOUNT&versionLabel=$2" \
                          -H "x-api-key: $KEY")
                        echo -n "$1 v$2: "
                        [ "$HTTP" = "200" ] && echo "OK" || { echo "NOT FOUND (HTTP=$HTTP)"; exit 1; }
                      }

                      chk "DiegoCITemplateWorkshop" "1.0.0"
                      chk "DiegoIDPTemplateWorkshop" "1.0.0"
                      echo "All account templates verified"
              - step:
                  name: Create Harness Service
                  identifier: create_harness_service
                  type: Run
                  timeout: 5m
                  spec:
                    shell: Sh
                    command: |-
                      set -e
                      KEY=<+secrets.getValue("account.harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      APP_NAME="<+pipeline.variables.app_name>"
                      SERVICE_NAME="<+pipeline.variables.service_name>"
                      SERVICE_TYPE="<+pipeline.variables.service_type>"
                      SERVICE_ID=$(echo "$SERVICE_NAME" | tr '-' '_')
                      RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
                        "https://app.harness.io/ng/api/servicesV2?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                        -H "x-api-key: $KEY" -H "Content-Type: application/json" \
                        -d "{\"name\": \"$APP_NAME\", \"identifier\": \"$SERVICE_ID\", \"orgIdentifier\": \"$ORG\", \"projectIdentifier\": \"$PROJ_ID\", \"description\": \"<+pipeline.variables.service_description>\", \"tags\": {\"service_type\": \"$SERVICE_TYPE\"}}")
                      HTTP_CODE=$(echo "$RESP" | grep "HTTP:" | cut -d: -f2)
                      if echo "$RESP" | grep -q "already exists\|DUPLICATE\|409"; then echo "Service exists"
                      elif [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then echo "Service created: $APP_NAME"
                      else echo "Service HTTP $HTTP_CODE (non-blocking)"
                      fi
              - step:
                  name: Create HAR Registry
                  identifier: create_har_registry
                  type: Run
                  timeout: 5m
                  spec:
                    shell: Sh
                    command: |-
                      set -e
                      KEY=<+secrets.getValue("account.harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      APP_NAME="<+pipeline.variables.app_name>"
                      # One Docker registry per project — all service images live inside it
                      SPACE_REF="${ACCOUNT}/${ORG}/${PROJ_ID}"
                      ORG_LOWER=$(echo "$ORG" | tr '[:upper:]' '[:lower:]')
                      # Prefix with org to avoid ghost-registry collisions (HAR IDs are account-global)
                      REG_ID="${ORG_LOWER}_${PROJ_ID}"
                      REG_NAME="${APP_NAME}"
                      ACCOUNT_LOWER=$(echo "$ACCOUNT" | tr '[:upper:]' '[:lower:]')

                      create_har() {
                        curl -s -o /tmp/hr.txt -w "%{http_code}" -X POST \
                          "https://app.harness.io/har/api/v1/registry?space_ref=${SPACE_REF}" \
                          -H "x-api-key: $KEY" -H "Content-Type: application/json" \
                          -d "{\"identifier\":\"${REG_ID}\",\"name\":\"${REG_NAME}\",\"packageType\":\"DOCKER\",\"type\":\"VIRTUAL\",\"parentRef\":\"${SPACE_REF}\",\"config\":{\"type\":\"VIRTUAL\"}}"
                      }

                      echo -n "HAR registry $REG_ID: "
                      RESP=$(create_har)
                      if [ "$RESP" = "200" ] || [ "$RESP" = "201" ]; then
                        echo "CREATED"
                      elif [ "$RESP" = "409" ] || grep -qi "already exists\|DUPLICATE\|already_exists\|already defined" /tmp/hr.txt 2>/dev/null; then
                        echo "EXISTS (409) — extracting actual owner and purging..."
                        OWNER_REF=$(grep -o "under '[^']*'" /tmp/hr.txt | grep -o "'[^']*'" | tr -d "'" | head -1)
                        [ -z "$OWNER_REF" ] && OWNER_REF="${ACCOUNT}/${ORG}/${PROJ_ID}"
                        OWNER_SPACE=$(echo "$OWNER_REF" | cut -d'/' -f2-)

                        try_del_url() {
                          local URL="$1"
                          DEL_HTTP=$(curl -s -o /tmp/hr_del.txt -w "%{http_code}" -X DELETE "$URL" -H "x-api-key: $KEY")
                          echo "  DELETE $URL => HTTP=$DEL_HTTP: $(head -c 80 /tmp/hr_del.txt)"
                          [ "$DEL_HTTP" = "200" ] || [ "$DEL_HTTP" = "204" ]
                        }
                        try_del() {
                          local SPACE="$1"
                          local FULL="${ACCOUNT}/${SPACE}"
                          try_del_url "https://app.harness.io/har/api/v1/registry/${SPACE}/${REG_ID}" && return 0
                          try_del_url "https://app.harness.io/har/api/v1/registry/${FULL}/${REG_ID}" && return 0
                          try_del_url "https://app.harness.io/har/api/v1/registry/${REG_ID}?space_ref=${SPACE}" && return 0
                          try_del_url "https://app.harness.io/har/api/v1/registry/${REG_ID}?space_ref=${FULL}" && return 0
                          return 1
                        }

                        echo "  Owner space: $OWNER_SPACE — trying query-param DELETE..."
                        DEL_OK=false
                        try_del "${OWNER_SPACE}" && DEL_OK=true
                        $DEL_OK || { try_del "${ORG}/${PROJ_ID}" && DEL_OK=true; }
                        for ALT_ORG in Admin LAB default; do
                          $DEL_OK && break
                          [ "$ALT_ORG" = "$ORG" ] && continue
                          try_del "${ALT_ORG}/${PROJ_ID}" && DEL_OK=true
                        done

                        if $DEL_OK; then
                          sleep 3
                          RESP2=$(create_har)
                          if [ "$RESP2" = "200" ] || [ "$RESP2" = "201" ]; then echo "RECREATED"
                          else echo "FAIL after purge+recreate HTTP=$RESP2: $(head -c 300 /tmp/hr.txt)"; exit 1
                          fi
                        else
                          echo "WARNING: registry ${REG_ID} orphaned — cannot delete, accepting existing (CI will use it)"
                        fi
                      else
                        echo "FAIL HTTP=$RESP: $(head -c 300 /tmp/hr.txt)"; exit 1
                      fi
                      # Create DockerRegistry connector (same ID as HAR registry) for Trivy image scan.
                      # The CI template also has a connectorRef input for AquaTrivy — this connector
                      # points to pkg.harness.io so Trivy can pull the pushed image for scanning.
                      CONN_JSON="{\"connector\":{\"name\":\"${REG_NAME}\",\"identifier\":\"${REG_ID}\",\"orgIdentifier\":\"${ORG}\",\"projectIdentifier\":\"${PROJ_ID}\",\"type\":\"DockerRegistry\",\"spec\":{\"dockerRegistryUrl\":\"https://pkg.harness.io/${ACCOUNT_LOWER}/${REG_ID}\",\"providerType\":\"DockerHub\",\"executeOnDelegate\":false,\"auth\":{\"type\":\"UsernamePassword\",\"spec\":{\"username\":\"harness_pat\",\"passwordRef\":\"account.harness_api_key\"}}}}}"
                      CONN_HTTP=$(curl -s -o /tmp/conn.txt -w "%{http_code}" -X POST \
                        "https://app.harness.io/ng/api/connectors?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                        -H "x-api-key: $KEY" -H "Content-Type: application/json" \
                        -d "$CONN_JSON")
                      if echo "$CONN_HTTP" | grep -qE "^20"; then
                        echo "HAR DockerRegistry connector created: $REG_ID"
                      elif grep -qi "already exists\|DUPLICATE\|already_exists\|already defined" /tmp/conn.txt 2>/dev/null; then
                        echo "HAR DockerRegistry connector already exists: $REG_ID — updating URL to ensure correctness"
                        UPD_HTTP=$(curl -s -o /tmp/conn_upd.txt -w "%{http_code}" -X PUT \
                          "https://app.harness.io/ng/api/connectors?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                          -H "x-api-key: $KEY" -H "Content-Type: application/json" \
                          -d "$CONN_JSON")
                        if echo "$UPD_HTTP" | grep -qE "^20"; then
                          echo "HAR DockerRegistry connector updated: $REG_ID"
                        else
                          echo "WARNING: HAR connector update HTTP=$UPD_HTTP: $(head -c 300 /tmp/conn_upd.txt)"
                        fi
                      else
                        echo "WARNING: HAR connector create HTTP=$CONN_HTTP: $(head -c 300 /tmp/conn.txt)"
                      fi
              - step:
                  name: Create CI Pipeline
                  identifier: create_ci_pipeline
                  type: Run
                  timeout: 10m
                  spec:
                    shell: Sh
                    command: |-
                      set -e
                      KEY=<+secrets.getValue("account.harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      APP_NAME="<+pipeline.variables.app_name>"
                      SERVICE_NAME="<+pipeline.variables.service_name>"
                      SERVICE_TYPE="<+pipeline.variables.service_type>"
                      SERVICE_ID=$(echo "$SERVICE_NAME" | tr '-' '_')
                      # Lowercase account ID — HAR push URL format: pkg.harness.io/{accountLower}/{registryId}/{imageName}
                      ACCOUNT_LOWER=$(echo "$ACCOUNT" | tr '[:upper:]' '[:lower:]')
                      ORG_LOWER=$(echo "$ORG" | tr '[:upper:]' '[:lower:]')
                      # HAR registry ID: {org_lower}_{proj_id} — matches create_har_registry step
                      REG_ID="${ORG_LOWER}_${PROJ_ID}"

                      LT='<' PL='+' GT='>'
                      INP="${LT}${PL}input${GT}"

                      make_pipeline() {
                        PIPE_NAME="$1"; PIPE_ID="$2"; SDIR="$3"; IMG="$4"; DFILE="$5"; CTX="$6"
                        GEN_OAS="$7"; CAT_ENT="$8"; CAT_FILE="$9"; OAS_FILE="${10}"
                        [ -z "$OAS_FILE" ] && OAS_FILE="skip"
                        cat > /tmp/pipe.yaml << PIPEEOF
                      pipeline:
                        name: ${PIPE_NAME}
                        identifier: ${PIPE_ID}
                        projectIdentifier: ${PROJ_ID}
                        orgIdentifier: ${ORG}
                        tags:
                          setup: ""
                        stages:
                          - stage:
                              name: CI
                              identifier: ci_stage
                              failureStrategies:
                                - onFailure:
                                    errors:
                                      - AllErrors
                                    action:
                                      type: Ignore
                              template:
                                templateRef: account.DiegoCITemplateWorkshop
                                versionLabel: 1.0.0
                                templateInputs:
                                  type: CI
                                  variables:
                                    - name: SERVICE_DIR
                                      type: String
                                      value: ${SDIR}
                                    - name: IMAGE_NAME
                                      type: String
                                      value: ${IMG}
                                    - name: DOCKERFILE
                                      type: String
                                      value: ${DFILE}
                                    - name: DOCKER_CONTEXT
                                      type: String
                                      value: ${CTX}
                                    - name: GENERATE_OPENAPI
                                      type: String
                                      value: "${GEN_OAS}"
                                    - name: CATALOG_ENTITY
                                      type: String
                                      value: ${CAT_ENT}
                                    - name: SONAR_PROJECT_KEY
                                      type: String
                                      value: "${SERVICE_NAME}"
                                  spec:
                                    execution:
                                      steps:
                                        - stepGroup:
                                            identifier: build_push_har
                                            steps:
                                              - step:
                                                  identifier: push_har
                                                  type: BuildAndPushDockerRegistry
                                                  spec:
                                                    repo: ${IMG}
                                                    registryRef: ${REG_ID}
                                        - stepGroup:
                                            identifier: security_container
                                            steps:
                                              - step:
                                                  identifier: trivy_scan
                                                  type: AquaTrivy
                                                  spec:
                                                    image:
                                                      type: harness
                                                      registry: ${REG_ID}
                                                      domain: app.harness.io/registry
                          - stage:
                              name: IDP
                              identifier: idp_stage
                              failureStrategies:
                                - onFailure:
                                    errors:
                                      - AllErrors
                                    action:
                                      type: Ignore
                              template:
                                templateRef: account.DiegoIDPTemplateWorkshop
                                versionLabel: 1.0.0
                                templateInputs:
                                  type: IDP
                                  variables:
                                    - name: CATALOG_ENTITY
                                      type: String
                                      value: ${CAT_ENT}
                                    - name: CI_STAGE_ID
                                      type: String
                                      value: ci_stage
                                    - name: CATALOG_FILE
                                      type: String
                                      value: ${CAT_FILE}
                                    - name: OPENAPI_FILE
                                      type: String
                                      value: "${OAS_FILE}"
                        properties:
                          ci:
                            codebase:
                              repoName: ${SERVICE_NAME}
                              build: ${INP}
                      PIPEEOF
                        echo "==> Creating pipeline: $PIPE_NAME"
                        RESP=$(curl -s -o /tmp/pr.txt -w "%{http_code}" -X POST \
                          "https://app.harness.io/pipeline/api/pipelines?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                          -H "x-api-key: $KEY" -H "Content-Type: application/yaml" --data-binary @/tmp/pipe.yaml)
                        if grep -q "already exists\|DUPLICATE\|409" /tmp/pr.txt 2>/dev/null; then
                          UPD=$(curl -s -o /tmp/pu.txt -w "%{http_code}" -X PUT \
                            "https://app.harness.io/pipeline/api/pipelines/${PIPE_ID}?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                            -H "x-api-key: $KEY" -H "Content-Type: application/yaml" --data-binary @/tmp/pipe.yaml)
                          if [ "$UPD" = "200" ] || [ "$UPD" = "201" ]; then echo "  updated: $PIPE_NAME"
                          else echo "  update failed HTTP=$UPD: $(head -c 300 /tmp/pu.txt)"; fi
                        elif [ "$RESP" = "200" ] || [ "$RESP" = "201" ]; then echo "  created: $PIPE_NAME"
                        else echo "  failed HTTP=$RESP: $(head -c 300 /tmp/pr.txt)"; exit 1
                        fi
                      }

                      case "$SERVICE_TYPE" in
                        backend)
                          make_pipeline "${APP_NAME}-api-ci" "${SERVICE_ID}_api_ci" \
                            "backend" "${SERVICE_NAME}-api" "backend/Dockerfile" "backend" "true" \
                            "${SERVICE_ID}_api" "catalog/${SERVICE_NAME}-api.yaml" "catalog/${SERVICE_NAME}-openapi.yaml"
                          ;;
                        frontend)
                          make_pipeline "${APP_NAME}-web-ci" "${SERVICE_ID}_web_ci" \
                            "frontend" "${SERVICE_NAME}-web" "frontend/Dockerfile" "frontend" "false" \
                            "${SERVICE_ID}_web" "catalog/${SERVICE_NAME}-web.yaml" ""
                          ;;
                        fullstack)
                          make_pipeline "${APP_NAME}-api-ci" "${SERVICE_ID}_api_ci" \
                            "backend" "${SERVICE_NAME}-api" "backend/Dockerfile" "backend" "true" \
                            "${SERVICE_ID}_api" "catalog/${SERVICE_NAME}-api.yaml" "catalog/${SERVICE_NAME}-openapi.yaml"
                          make_pipeline "${APP_NAME}-web-ci" "${SERVICE_ID}_web_ci" \
                            "frontend" "${SERVICE_NAME}-web" "frontend/Dockerfile" "frontend" "false" \
                            "${SERVICE_ID}_web" "catalog/${SERVICE_NAME}-web.yaml" ""
                          ;;
                      esac
              - step:
                  name: Create SonarQube Project
                  identifier: create_sonarqube_project
                  type: Run
                  timeout: 5m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Ignore
                  spec:
                    shell: Bash
                    command: |-
                      set -euo pipefail
                      SONAR_TOKEN_VAL=<+secrets.getValue("account.sonar_token")>
                      SONAR_HOST=<+secrets.getValue("account.sonar_host_url")>
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      SERVICE_NAME="<+pipeline.variables.service_name>"
                      ORG_LOWER="${ORG,,}"
                      SONAR_KEY="${ORG_LOWER}__${PROJ_ID}__${SERVICE_NAME}"

                      echo "==> Ensuring SonarQube project exists: $SONAR_KEY"

                      if echo "$SONAR_HOST" | grep -qi "sonarcloud"; then
                        SONAR_ORG="diegopereiraeng"
                        HTTP=$(curl -sf -o /tmp/sq.txt -w "%{http_code}" -X POST \
                          "https://sonarcloud.io/api/projects/create" \
                          -H "Authorization: Bearer ${SONAR_TOKEN_VAL}" \
                          -d "organization=${SONAR_ORG}&project=${SONAR_KEY}&name=${SERVICE_NAME}&visibility=public" || echo "000")
                      else
                        HTTP=$(curl -sf -o /tmp/sq.txt -w "%{http_code}" -X POST \
                          "${SONAR_HOST}/api/projects/create" \
                          -H "Authorization: Bearer ${SONAR_TOKEN_VAL}" \
                          -d "project=${SONAR_KEY}&name=${SERVICE_NAME}" || echo "000")
                      fi

                      BODY=$(cat /tmp/sq.txt 2>/dev/null || echo "")
                      if [ "$HTTP" = "200" ]; then
                        echo "SonarQube project created: $SONAR_KEY"
                      elif echo "$BODY" | grep -qi "already exists\|key_already\|already been taken\|key_already_exists"; then
                        echo "SonarQube project already exists: $SONAR_KEY"
                      else
                        echo "SonarQube create HTTP=$HTTP (non-blocking): ${BODY:0:200}"
                      fi
              - step:
                  name: Trigger First CI Run
                  identifier: trigger_ci_pipeline
                  type: Run
                  timeout: 5m
                  spec:
                    shell: Sh
                    command: |-
                      set -e
                      KEY=<+secrets.getValue("account.harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      SERVICE_NAME="<+pipeline.variables.service_name>"
                      SERVICE_TYPE="<+pipeline.variables.service_type>"
                      SERVICE_ID=$(echo "$SERVICE_NAME" | tr '-' '_')

                      trigger_pipeline() {
                        PIPE_ID="$1"
                        sleep 2
                        RUN_RESP=$(curl -s -w "\nHTTP:%{http_code}" -X POST \
                          "https://app.harness.io/pipeline/api/pipeline/execute/${PIPE_ID}?accountIdentifier=$ACCOUNT&orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                          -H "x-api-key: $KEY" -H "Content-Type: application/yaml" \
                          --data-binary "pipeline:
                          identifier: ${PIPE_ID}
                          properties:
                            ci:
                              codebase:
                                build:
                                  type: branch
                                  spec:
                                    branch: main")
                        HTTP_CODE=$(echo "$RUN_RESP" | grep "HTTP:" | cut -d: -f2)
                        BODY=$(echo "$RUN_RESP" | grep -v "^HTTP:")
                        if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
                          EXEC_ID=$(echo "$BODY" | grep -o '"planExecutionId":"[^"]*"' | head -1 | cut -d'"' -f4)
                          echo "    CI triggered: $PIPE_ID (exec: $EXEC_ID)"
                        else
                          echo "    Trigger HTTP $HTTP_CODE for $PIPE_ID (non-blocking)"
                          echo "$BODY" | head -3
                        fi
                      }

                      case "$SERVICE_TYPE" in
                        backend)  trigger_pipeline "${SERVICE_ID}_api_ci" ;;
                        frontend) trigger_pipeline "${SERVICE_ID}_web_ci" ;;
                        fullstack)
                          trigger_pipeline "${SERVICE_ID}_api_ci"
                          trigger_pipeline "${SERVICE_ID}_web_ci"
                          ;;
                      esac
    - stage:
        name: Register Catalog
        identifier: register_catalog_stage
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  name: Import Catalog Entities
                  identifier: import_catalog
                  type: Run
                  timeout: 5m
                  spec:
                    shell: Sh
                    command: |-
                      set -e
                      KEY=<+secrets.getValue("account.harness_api_key")>
                      ACCOUNT="<+account.identifier>"
                      ORG="<+pipeline.variables.harness_org>"
                      PROJ_ID="<+pipeline.variables.project_identifier>"
                      SERVICE_NAME="<+pipeline.variables.service_name>"
                      SERVICE_TYPE="<+pipeline.variables.service_type>"
                      purge_stale_source_location() {
                        # Remove catalog location records matching this file — uses idp.harness.io Backstage catalog API
                        # IDP tracks imports globally by (repo_url+file_path) — must purge before re-import
                        local FILE_PATH="$1"
                        LOCS=$(curl -s \
                          "https://idp.harness.io/${ACCOUNT}/idp/api/catalog/locations" \
                          -H "x-api-key: $KEY")
                        # Extract all location IDs then fetch each to check if it matches our file path
                        echo "$LOCS" | grep -oE '"id":"[^"]+"' | sed 's/"id":"//;s/"//' | while read -r LOC_ID; do
                          [ -z "$LOC_ID" ] && continue
                          LOC=$(curl -s "https://idp.harness.io/${ACCOUNT}/idp/api/catalog/locations/${LOC_ID}" -H "x-api-key: $KEY")
                          if echo "$LOC" | grep -q "$FILE_PATH"; then
                            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                              "https://idp.harness.io/${ACCOUNT}/idp/api/catalog/locations/${LOC_ID}" \
                              -H "x-api-key: $KEY")
                            echo " Purged catalog location ${LOC_ID} (HTTP=$HTTP) for $FILE_PATH"
                          fi
                        done
                      }
                      import_entity() {
                        local FILE_PATH="$1" LABEL="$2"
                        do_import() {
                          curl -s -w "\nHTTP:%{http_code}" -X POST \
                            "https://app.harness.io/v1/entities/import?orgIdentifier=$ORG&projectIdentifier=$PROJ_ID" \
                            -H "Content-Type: application/json" -H "Harness-Account: $ACCOUNT" -H "x-api-key: $KEY" \
                            -d "{\"repo_name\": \"$SERVICE_NAME\", \"branch_name\": \"main\", \"file_path\": \"$FILE_PATH\", \"is_harness_code_repo\": true}"
                        }
                        RESP=$(do_import)
                        HTTP_CODE=$(echo "$RESP" | grep "HTTP:" | cut -d: -f2)
                        BODY=$(echo "$RESP" | grep -v "^HTTP:")
                        if [ "$HTTP_CODE" = "201" ]; then
                          echo "$LABEL registered"
                        elif echo "$BODY" | grep -q "DUPLICATE_FILE_IMPORT"; then
                          echo "$LABEL duplicate — purging stale source-location and retrying..."
                          purge_stale_source_location "$FILE_PATH"
                          sleep 3
                          RESP=$(do_import)
                          HTTP_CODE=$(echo "$RESP" | grep "HTTP:" | cut -d: -f2)
                          BODY=$(echo "$RESP" | grep -v "^HTTP:")
                          if [ "$HTTP_CODE" = "201" ]; then echo "$LABEL registered (after purge)"
                          else echo "$LABEL still failed HTTP $HTTP_CODE: $(echo "$BODY" | head -c 200)"
                          fi
                        else
                          echo "$LABEL HTTP $HTTP_CODE"; echo "$BODY" | head -c 200
                        fi
                      }
                      case "$SERVICE_TYPE" in
                        fullstack) import_entity "catalog/$SERVICE_NAME-api.yaml" "API"; import_entity "catalog/$SERVICE_NAME-web.yaml" "Web"; import_entity "catalog/$SERVICE_NAME-openapi.yaml" "OpenAPI";;
                        backend) import_entity "catalog/$SERVICE_NAME-api.yaml" "API"; import_entity "catalog/$SERVICE_NAME-openapi.yaml" "OpenAPI";;
                        frontend) import_entity "catalog/$SERVICE_NAME-web.yaml" "Web";;
                      esac
                      echo "Done! Project: https://app.harness.io/ng/account/$ACCOUNT/all/orgs/$ORG/projects/$PROJ_ID"