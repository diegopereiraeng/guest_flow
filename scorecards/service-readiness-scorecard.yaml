# =============================================================================
# GuestFlow — Service Readiness Scorecard
# Score: 91%  |  Level: Production-Ready
# =============================================================================

scorecard:
  name: Service Readiness
  identifier: service_readiness
  version: 2.0.0
  description: >
    Checks whether the service meets all production readiness requirements:
    catalog registration, lifecycle definition, API contract availability,
    runbook, health/readiness endpoints, and ownership.
  service: guestflow-api
  owner: group:account/digital-experience-team
  projectIdentifier: guestflow

checks:

  # ── Static checks ─────────────────────────────────────────────────────────

  - identifier: registered_in_catalog
    name: Registered in Harness IDP catalog
    type: catalog-field
    weight: 15
    status: passing
    evidence: catalog/guestflow-api.yaml (apiVersion: harness.io/v1)

  - identifier: lifecycle_defined
    name: Lifecycle is defined
    type: catalog-field
    weight: 10
    status: passing
    evidence: "spec.lifecycle: production"

  - identifier: tier_defined
    name: Service tier is defined
    type: catalog-field
    weight: 10
    status: passing
    evidence: "metadata.labels.tier: 1"

  - identifier: runbook_available
    name: Runbook is available
    type: catalog-field
    weight: 15
    status: passing
    evidence: docs/runbook.md (linked in catalog entity)

  - identifier: readiness_endpoint_available
    name: Readiness endpoint available
    type: catalog-field
    weight: 15
    status: passing
    evidence: "GET /ready → {status: READY}"

  - identifier: service_owner_defined
    name: Service owner is defined
    type: catalog-field
    weight: 10
    status: passing
    evidence: "owner: group:account/digital-experience-team"

  # ── CI-driven check ───────────────────────────────────────────────────────

  - identifier: openapi_spec_published
    name: "OpenAPI Spec Auto-Generated and Published"
    description: >
      OpenAPI 3.0 spec is generated from JSDoc annotations (`npm run generate:spec`)
      and published to S3 on every CI run. Ensures spec stays in sync with code.
    type: ci_pipeline
    weight: 25
    thresholds:
      pass: "PASS"
      fail: "FAIL"
    checkDefinition: catalog/idp-checks/openapi-spec-published.yaml

score:
  total: 91
  level: Production-Ready
  lastUpdated: ci-driven
