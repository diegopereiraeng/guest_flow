# =============================================================================
# GuestFlow — Security Scorecard
# Score: 95%  |  Level: Elite
#
# All security checks are CI-driven and updated on every pipeline run.
# Scanners used (all open source):
#   SAST:      Semgrep   (returntocorp/semgrep)
#   SCA:       Grype     (anchore/grype)
#   Container: Trivy     (aquasec/trivy)
#   Quality:   SonarQube (static analysis + security rules)
# =============================================================================

scorecard:
  name: Security Posture
  identifier: security_posture
  version: 2.0.0
  description: >
    Evaluates security scanning, secrets management and deployment gates.
    All scans run as pipeline stages and results are published to IDP after
    each CI execution. Critical findings block ECR push.
  service: guestflow-api
  owner: group:account/digital-experience-team
  projectIdentifier: guestflow

checks:

  # ── CI-driven security checks ─────────────────────────────────────────────

  - identifier: sast_no_critical_findings
    name: "SAST — No Critical Findings (Semgrep)"
    description: >
      Semgrep scans src/ with rulesets: auto, owasp-top-ten, nodejs, typescript.
      Zero ERROR-severity findings required to pass.
      Pipeline stage: sast_semgrep → idp_scorecard_checks.
    type: ci_pipeline
    scanner: semgrep
    scannerType: open-source
    scannerImage: returntocorp/semgrep:latest
    weight: 30
    thresholds:
      pass: "0 critical findings"
      fail: "> 0 critical findings"
    checkDefinition: catalog/idp-checks/sast-no-critical-findings.yaml

  - identifier: sca_no_critical_vulnerabilities
    name: "SCA — No Critical Vulnerabilities (Grype)"
    description: >
      Grype scans backend/ and frontend/ dependency trees.
      Zero Critical-severity CVEs required. High CVEs are reported
      but non-blocking (configurable).
      Pipeline stage: sca_grype.
    type: ci_pipeline
    scanner: grype
    scannerType: open-source
    scannerImage: anchore/grype:latest
    weight: 25
    thresholds:
      pass: "0 critical CVEs"
      warn: "0 critical, ≤ 3 high CVEs"
      fail: "> 0 critical CVEs"

  - identifier: container_scan_no_critical_cve
    name: "Container Scan — No Critical CVEs (Trivy)"
    description: >
      Trivy scans guestflow-api and guestflow-web Docker images.
      Zero CRITICAL CVEs required across both images.
      Pipeline stage: container_scan_trivy → idp_scorecard_checks.
    type: ci_pipeline
    scanner: trivy
    scannerType: open-source
    scannerImage: aquasec/trivy:latest
    weight: 35
    thresholds:
      pass: "0 critical CVEs"
      fail: "> 0 critical CVEs"
    checkDefinition: catalog/idp-checks/container-scan-no-critical-cve.yaml

  # ── Static checks ─────────────────────────────────────────────────────────

  - identifier: critical_vulnerabilities_block_deployment
    name: Critical vulnerabilities block deployment
    description: >
      CI pipeline exits non-zero on any critical finding, preventing
      ECR push and CD trigger.
    type: catalog-field
    weight: 10
    status: passing
    evidence: >
      pipelines/harness-ci-pipeline.yaml —
      stages sast_semgrep, sca_grype, container_scan_trivy all use --fail-on critical

score:
  total: 95
  level: Elite
  lastUpdated: ci-driven
