version: '3.9'

services:
  guestflow-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guestflow-api
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
      APP_VERSION: '1.0.0'
      GIT_COMMIT: docker-compose
      APP_ENV: docker
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 3

  guestflow-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: guestflow-web
    ports:
      - '3000:3000'
    depends_on:
      guestflow-api:
        condition: service_healthy
