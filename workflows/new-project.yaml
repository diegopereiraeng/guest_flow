apiVersion: harness.io/v1
kind: Workflow
identifier: new_project_setup
name: New Project Setup
description: "Scaffold a new service from the cookiecutter template → push to GitHub → create Harness project, Harness Code repo, service, CI pipeline, and IDP catalog."
owner: group:account/_account_all_users
tags:
  self-service: ""
  idp: ""
spec:
  parameters:
    - title: App Identity
      required:
        - app_name
        - service_name
        - service_type
        - token
      properties:
        token:
          title: Harness Auth Token
          type: string
          ui:widget: password
          ui:field: HarnessAuthToken
        app_name:
          title: App Name
          type: string
          description: "Display name for your app (shown in pipelines, catalog, dashboards)"
          ui:autofocus: true
          ui:placeholder: "GuestFlow API"
        service_name:
          title: Service Identifier
          type: string
          description: "Technical name used for repo, folder, and catalog identifiers (lowercase, hyphens)"
          pattern: "^[a-z][a-z0-9-]*$"
          ui:placeholder: "guest-flow"
        service_description:
          title: Description
          type: string
          description: "One-liner describing what this service does"
          ui:placeholder: "Hotel guest check-in and management platform"
          default: ""
        service_type:
          title: Service Type
          type: string
          description: "Determines which CI stages and catalog entities are generated"
          enum:
            - fullstack
            - backend
            - frontend
          enumNames:
            - "Full Stack (backend API + frontend SPA)"
            - "Backend only (REST API)"
            - "Frontend only (SPA)"
          default: fullstack

    - title: Project & Admin
      required:
        - project_name
        - project_identifier
        - admin_email
      properties:
        project_name:
          title: Harness Project Name
          type: string
          description: "Human-readable name for the new Harness project"
          ui:placeholder: "GuestFlow Demo"
        project_identifier:
          title: Harness Project Identifier
          type: string
          description: "Unique identifier (lowercase, underscores only)"
          pattern: "^[a-z][a-z0-9_]*$"
          ui:placeholder: "guestflow_demo"
        project_description:
          title: Project Description
          type: string
          description: "Short description of the project"
          default: ""
        admin_email:
          title: Admin Email
          type: string
          description: "User to add as Project Admin"
          format: email
          ui:placeholder: "you@company.com"

    - title: Configuration
      properties:
        harness_org:
          title: Harness Organization
          type: string
          default: "TPM"
        github_org:
          title: GitHub Organization
          type: string
          default: "diegopereiraeng"
        coverage_threshold:
          title: Coverage Threshold (%)
          type: string
          default: "80"

  steps:
    # ─── Step 1: Scaffold code from cookiecutter template ─────────
    - id: scaffold
      name: Generate from Cookiecutter Template
      action: fetch:cookiecutter
      input:
        url: https://github.com/diegopereiraeng/cookiecutter-harness-service
        values:
          service_name: ${{ parameters.service_name }}
          service_description: ${{ parameters.service_description }}
          service_type: ${{ parameters.service_type }}
          owner_email: ${{ parameters.admin_email }}
          github_org: ${{ parameters.github_org }}
          harness_org: ${{ parameters.harness_org }}
          harness_project: ${{ parameters.project_identifier }}
          coverage_threshold: ${{ parameters.coverage_threshold }}

    # ─── Step 2: Push scaffolded code to GitHub ───────────────────
    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        allowedHosts:
          - github.com
        description: ${{ parameters.service_description }}
        repoUrl: "github.com?owner=${{ parameters.github_org }}&repo=${{ parameters.service_name }}"
        defaultBranch: main
        repoVisibility: public

    # ─── Step 3: Create Harness project, repo, service & pipeline ─
    - id: setup
      name: Setup Harness Infrastructure
      action: trigger:harness-custom-pipeline
      input:
        url: "https://app.harness.io/ng/account/8INL1LHjRmmrZQKdYtlvKA/all/orgs/TPM/projects/Diego/pipelines/project_setup/pipeline-studio"
        inputset:
          app_name: ${{ parameters.app_name }}
          project_name: ${{ parameters.project_name }}
          project_identifier: ${{ parameters.project_identifier }}
          project_description: ${{ parameters.project_description }}
          admin_email: ${{ parameters.admin_email }}
          service_name: ${{ parameters.service_name }}
          service_description: ${{ parameters.service_description }}
          service_type: ${{ parameters.service_type }}
          harness_org: ${{ parameters.harness_org }}
          github_org: ${{ parameters.github_org }}
          coverage_threshold: ${{ parameters.coverage_threshold }}
        apikey: ${{ parameters.token }}

  output:
    links:
      - title: GitHub Repository
        url: "https://github.com/${{ parameters.github_org }}/${{ parameters.service_name }}"
        icon: github
      - title: Harness Project
        url: "https://app.harness.io/ng/account/8INL1LHjRmmrZQKdYtlvKA/all/orgs/${{ parameters.harness_org }}/projects/${{ parameters.project_identifier }}"
        icon: dashboard
      - title: IDP Catalog
        url: "https://app.harness.io/ng/account/8INL1LHjRmmrZQKdYtlvKA/module/idp/catalog"
        icon: catalog
